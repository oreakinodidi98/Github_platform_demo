name: Storefront checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build storefront
        run: mvn --batch-mode --no-transfer-progress package
      - name: Check storefront in Chrome
        run: |
          java -jar target/brightshop-storefront-0.1.0-SNAPSHOT.jar \
            --server.address=127.0.0.1 --server.port=18765 \
            '--spring.web.resources.static-locations=file:./src/test/resources/,classpath:/static/' \
            > "$RUNNER_TEMP/brightshop-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18765/storefront-test.html > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18765/storefront-test.html > /dev/null
          google-chrome --headless=new --disable-gpu --disable-dev-shm-usage --no-sandbox \
            --window-size=375,812 --user-data-dir="$RUNNER_TEMP/brightshop-chrome" \
            --virtual-time-budget=10000 --dump-dom http://127.0.0.1:18765/storefront-test.html \
            > "$RUNNER_TEMP/brightshop-result.html"
          if ! grep -Fq '<body data-status="passed">' "$RUNNER_TEMP/brightshop-result.html"; then
            cat "$RUNNER_TEMP/brightshop-result.html" "$RUNNER_TEMP/brightshop-server.log"
            exit 1
          fi
          echo "Storefront browser checks passed."
