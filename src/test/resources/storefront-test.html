<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>BrightShop browser checks</title>
</head>
<body data-status="running">
    <h1>BrightShop browser checks</h1>
    <p id="result">Running</p>
    <script>
        async function runChecks() {
            localStorage.removeItem('brightshop-cart');
            const frame = document.createElement('iframe');
            frame.title = 'Storefront under test';
            const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
            frame.src = '/';
            document.body.append(frame);
            await loaded;

            let doc = frame.contentDocument;
            const win = frame.contentWindow;
            const main = () => doc.querySelector('#store');
            const check = (condition, message) => {
                if (!condition) throw new Error(message);
            };
            const checkCartPrice = (id, unitPrice, itemTotal) => {
                const row = main().querySelector(`a[href="#product/${id}"]`).closest('.cart-row');
                check(row.querySelector('h2 + p').firstChild.textContent.trim() === `${unitPrice} each`,
                    `Cart unit price is incorrect: ${id}`);
                check(row.querySelector('.price').textContent === `Item total: ${itemTotal}`,
                    `Cart item total is incorrect: ${id}`);
            };
            const checkSubtotal = expected => {
                check(main().querySelector('.summary .total strong:last-child').textContent === expected,
                    'Cart subtotal is incorrect');
                check(!main().textContent.includes(' EUR'), 'The cart still uses the amount-first currency format');
            };
            const checkLayout = () => check(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth,
                'The page overflows the browser width');
            const selectCategory = name => {
                const button = [...main().querySelectorAll('button')].find(item => item.textContent.trim() === name);
                check(button, `Missing category: ${name}`);
                button.click();
                check(main().querySelector('[aria-pressed="true"]').textContent.trim() === name,
                    `Category not selected: ${name}`);
            };
            const visit = async hash => {
                const link = doc.querySelector(`a[href="${hash}"]`);
                check(link, `Missing link: ${hash}`);
                if (win.location.hash === hash) return;
                const changed = new Promise(resolve => win.addEventListener('hashchange', resolve, { once: true }));
                link.click();
                await changed;
            };

            check(main().querySelectorAll('.card').length >= 8, 'The expanded catalog is not displayed');
            checkLayout();
            check(main().textContent.includes('Everyday Cotton Tee') && main().textContent.includes('€19.90'),
                'The original product or grid price is missing');
            const teeGridPrice = main().querySelector('a[href="#product/tee"]').closest('.card')
                .querySelector('.price').firstChild.textContent.trim();
            check(teeGridPrice === '€19.90', 'The tee grid price format is incorrect');
            selectCategory('Accessories');
            check(main().textContent.includes('Soft Knit Scarf') && main().textContent.includes('Cotton Crew Socks')
                && !main().textContent.includes('Glazed Stoneware Mug'), 'Accessories filter is incorrect');
            await visit('#product/scarf');
            check(main().querySelector('h1').textContent === 'Soft Knit Scarf', 'New product detail is missing');
            main().querySelector('[data-add="scarf"]').click();
            await visit('#cart');
            checkCartPrice('scarf', '€22.00', '€22.00');
            checkSubtotal('€22.00');
            main().querySelector('[data-add="scarf"]').click();
            checkCartPrice('scarf', '€22.00', '€44.00');
            checkSubtotal('€44.00');

            await visit('#shop');
            selectCategory('Kitchen & dining');
            check(main().textContent.includes('Stoneware Serving Bowl')
                && main().textContent.includes('Glazed Stoneware Mug')
                && !main().textContent.includes('Soft Knit Scarf'), 'Kitchen filter is incorrect');
            selectCategory('Living');
            check(main().textContent.includes('Textured Cushion') && main().textContent.includes('Woven Cotton Throw'),
                'Living filter is incorrect');
            selectCategory('Home goods');
            check(main().textContent.includes('Stoneware Serving Bowl') && main().textContent.includes('Woven Cotton Throw')
                && !main().textContent.includes('Soft Knit Scarf'), 'Home goods filter is incorrect');
            selectCategory('Clothes');
            check(main().textContent.includes('Soft Knit Scarf') && main().textContent.includes('Linen Blend Shirt'),
                'Clothes filter is incorrect');
            await visit('#product/tee');
            check(main().querySelector('.price').firstChild.textContent.trim() === teeGridPrice,
                'The tee detail price does not match the grid');
            main().querySelector('[data-add="tee"]').click();
            await visit('#cart');
            checkCartPrice('tee', teeGridPrice, '€19.90');
            checkCartPrice('scarf', '€22.00', '€44.00');
            checkSubtotal('€63.90');
            main().querySelector('[data-add="tee"]').click();
            checkCartPrice('tee', teeGridPrice, '€39.80');
            checkSubtotal('€83.80');
            main().querySelector('[data-less="tee"]').click();
            checkCartPrice('tee', teeGridPrice, '€19.90');
            checkSubtotal('€63.90');

            const reloaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
            win.location.reload();
            await reloaded;
            doc = frame.contentDocument;
            check(main().textContent.includes('Soft Knit Scarf') && main().textContent.includes('Everyday Cotton Tee'),
                'Cart did not survive a reload');
            checkCartPrice('tee', teeGridPrice, '€19.90');
            checkCartPrice('scarf', '€22.00', '€44.00');
            checkSubtotal('€63.90');
            main().querySelector('[data-less="tee"]').click();
            check(!main().textContent.includes('Everyday Cotton Tee'), 'Removing a cart item did not remove the tee');
            checkCartPrice('scarf', '€22.00', '€44.00');
            checkSubtotal('€44.00');

            const pages = [
                ['#location', 'Location', 'Amsterdam'],
                ['#history', 'Our story', '2014'],
                ['#opening-times', 'Opening times', '09:00'],
                ['#contact', 'Contact', 'hello@brightshop.example'],
                ['#faq', 'Frequently asked questions', 'Can I place an order?'],
                ['#refunds', 'Returns and refunds', '30 days']
            ];
            for (const [hash, heading, content] of pages) {
                await visit(hash);
                check(main().querySelector('h1').textContent === heading && main().textContent.includes(content),
                    `Information page is incorrect: ${heading}`);
                check(main().textContent.includes('fictional') &&
                    doc.querySelector('[data-nav][aria-current="page"]').getAttribute('href') === hash,
                    `Demo notice or active navigation is missing: ${heading}`);
                checkLayout();
                if (hash === '#faq') {
                    main().querySelector('summary').click();
                    check(main().querySelector('details').open, 'FAQ answer did not open');
                }
            }
        }

        runChecks().then(() => {
            document.body.dataset.status = 'passed';
            document.querySelector('#result').textContent = 'All browser checks passed.';
        }).catch(error => {
            document.body.dataset.status = 'failed';
            document.querySelector('#result').textContent = error.message;
            console.error(error);
        });
    </script>
</body>
</html>
